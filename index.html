<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>Amantes del Mate</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #FDFBF7;
        }

        .index-card {
            width: min(100% - 40px, 460px);
            padding: 40px;
            text-align: center;
        }

        .index-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #6B7B45;
            margin-bottom: 20px;
        }

        .index-card a {
            display: inline-block;
            margin-top: 10px;
            color: #6B7B45;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card index-card">
        <img src="img/logo-mate.jpg" alt="Logo Amantes del Mate">
        <h1>Amantes del Mate</h1>
        <p>Redirigiendo al inicio de sesión...</p>
        <a href="login.html">Ingresar manualmente</a>
    </main>

    <script>
        window.location.replace('login.html');
    </script>
</body>
</html>
